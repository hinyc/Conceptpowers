# develop용 CI. main은 배포 전용(릴리스 스크립트가 만든다)이라 여기서 돌리지 않는다.
# Windows는 검증된 적이 없어 매트릭스에 넣지 않았다.
name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm format:check
      - run: pnpm build
      # 빌드 산출물이 커밋된 것과 같은지: 원본을 고치고 다시 만들지 않았으면 여기서 실패한다.
      - name: 산출물이 최신인지 확인
        run: git diff --exit-code dist assets/serve.mjs
